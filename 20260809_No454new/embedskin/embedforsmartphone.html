<html lang="ja">
  <head>
    <title>embedforsmartphone</title>
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="cache-control" content="no-cache, no-store" />
    <meta http-equiv="expires" content="0" />
    <style type="text/css">
      body {
        margin: 0;
        overflow: hidden;
        background-color: #333333;
      }

      #startPanel {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        /*background-color:#000000;*/
        display: block;
        z-index: 10000;
      }

      #startPanel_bg {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        background-color: #000000;
        display: block;
        filter: alpha(opacity=50);
        -moz-opacity: 0.5;
        opacity: 0.5;
      }

      #startPlayBtn {
        position: absolute;
        top: 50%;
        margin-top: -51px;
        left: 0;
        width: 100%;
        height: 116px;
        text-align: center;
        display: block;
      }

      #startPlayBtnImg {
        width: 102px;
        height: 116px;
      }
    </style>
    <script type="text/javascript">
      document.addEventListener('DOMContentLoaded', function () {
        function getParam() {
          if (location.search.length > 1) {
            var param = {}
            var ch = location.search.substr(1).split('&')
            for (var i = 0; i < ch.length; i++) {
              var r = ch[i].split('=')
              param[r[0]] = r[1]
            }
            return param
          } else {
            return false
          }
        }
        var p = getParam()

        fetch('../book.xml')
          .then(function (response) {
            return response.text()
          })
          .then(function (text) {
            var parser = new DOMParser()
            var xml = parser.parseFromString(text, 'text/xml')
            var dataEl = xml.querySelector('setting bookInformation data')
            var labelArray = dataEl ? dataEl.textContent.split(',') : []
            var targetPage = labelArray[p['page'] - 1]

            document.getElementById('content').innerHTML =
              "<table width='100%' height='100%' ><tr><td align='center'><a href='../index.html#page=" +
              p['page'] +
              "' target='_blank'><img src='../page" +
              targetPage +
              "/thumbnail.jpg'></img></a></td></tr></table>"

            var targetURL = '../index.html#page=' + targetPage
            var linkEl = document.getElementById('link')
            linkEl.setAttribute('href', targetURL)
            linkEl.setAttribute('target', '_blank')

            var img = document.createElement('img')
            img.id = 'startPlayBtnImg'
            img.src = 'startplay.png'
            document.getElementById('startPlayBtn').appendChild(img)
          })
      })
    </script>
  </head>
  <body>
    <div id="content"></div>

    <a id="link">
      <div id="startPanel">
        <div id="startPanel_bg"></div>
        <div id="startPlayBtn"></div>
      </div>
    </a>
  </body>
</html>
